<!doctype html>
<!-- 변경 의도: Instagram 스타일 버전 2 이용 안내를 숨은 개발 경로에서 검토할 수 있게 제공 -->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Lilliput Cheongdam — Guide v2</title>
  <link rel="stylesheet" href="/instagram-preview.css">
</head>
<body data-page="guide">
  <div class="app-shell">
    <header class="app-header">
      <strong class="wordmark">lilliput.cheongdam</strong>
      <div class="header-actions">
        <select class="language-select" id="language-select" aria-label="언어 선택">
          <option value="ko">한국어</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="zh">中文</option>
        </select>
        <button class="icon-button" type="button" aria-label="메뉴">☰</button>
      </div>
    </header>
    <main>
      <section class="profile">
        <div class="profile-top">
          <div class="avatar-ring"><div class="avatar">Lilli</div></div>
          <div class="stats">
            <div class="stat"><strong>4</strong><span data-copy="posts">게시물</span></div>
            <div class="stat"><strong>10:30</strong><span data-copy="open">오픈</span></div>
            <div class="stat"><strong>4</strong><span data-copy="languages">언어</span></div>
          </div>
        </div>
        <div class="bio">
          <strong>Lilliput Cheongdam</strong>
          <p data-copy="bio">아이와 어른이 함께 쉬어가는 프리미엄 키즈 카페</p>
          <p>📍 Cheongdam · Seoul<br>☎ 02-515-9633</p>
          <a href="../메뉴/" data-copy="bioLink">메뉴판 바로가기 ↗</a>
        </div>
        <div class="profile-actions">
          <a class="primary" href="../메뉴/" data-copy="viewMenu">메뉴 보기</a>
          <a href="tel:025159633" data-copy="call">전화하기</a>
          <button type="button" aria-label="더 보기">⌄</button>
        </div>
      </section>
      <section class="stories" id="guide-stories" aria-label="안내 바로가기"></section>
      <div class="tab-bar">
        <button class="tab active" type="button" aria-label="게시물">▦</button>
        <button class="tab" type="button" aria-label="릴스">▶</button>
        <button class="tab" type="button" aria-label="태그">♙</button>
      </div>
      <section class="feed info-grid" id="guide-grid" aria-live="polite"></section>
    </main>
    <nav class="bottom-nav" aria-label="하단 메뉴">
      <a class="active" href="./" aria-label="홈">⌂</a>
      <a href="../메뉴/" aria-label="메뉴 검색">⌕</a>
      <a href="../메뉴/" aria-label="메뉴 피드">▣</a>
      <a href="#top" aria-label="위로 이동">◎</a>
    </nav>
  </div>
  <script src="/instagram-preview.js"></script>
</body>
</html>
